name: extension-zip

on:
  push:
    paths:
      - "apps/extension/**"

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the extension
        run: cd apps/extension && zip -r ../crosslister.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: crosslister
          path: crosslister.zip
