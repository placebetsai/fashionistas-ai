name: dns-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe cloudflare secrets for createstuff.ai DNS write
        env:
          T1: ${{ secrets.CF_API_TOKEN }}
          T2: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          Z: ca23f072cf08ee77d34c88ce36598265
        run: |
          set -uo pipefail
          api() { curl -sS -m 25 -H "Authorization: Bearer $1" "${@:2}"; }
          probe() {
            local label="$1" tok="$2"
            if [ -z "${tok:-}" ]; then echo "$label ABSENT"; return; fi
            local v vs acc z zs zmsg r rs rcode rmsg
            v=$(api "$tok" https://api.cloudflare.com/client/v4/user/tokens/verify)
            vs=$(echo "$v" | jq -r '.success // false')
            acc=$(api "$tok" https://api.cloudflare.com/client/v4/accounts | jq -r '[(.result[]?.id // "") | .[0:12]] | join(",")')
            z=$(api "$tok" "https://api.cloudflare.com/client/v4/zones/$Z")
            zs=$(echo "$z" | jq -r '.success // false')
            zmsg=$(echo "$z" | jq -r '.errors[0].message // "ok"')
            r=$(api "$tok" -X POST -H "Content-Type: application/json" \
                --data '{"type":"CNAME","name":"sites","content":"createstuff-sites.pages.dev","proxied":true,"ttl":1}' \
                "https://api.cloudflare.com/client/v4/zones/$Z/dns_records")
            rs=$(echo "$r" | jq -r '.success // false')
            rcode=$(echo "$r" | jq -r '.errors[0].code // ""')
            rmsg=$(echo "$r" | jq -r '.errors[0].message // ""')
            echo "$label verify=$vs accounts=$acc zoneRead=$zs($zmsg) dnsWrite=$rs code=$rcode msg=$rmsg"
          }


          ghp() {
            local label="$1" tok="$2"
            if [ -z "${tok:-}" ]; then echo "$label ABSENT"; return; fi
            local h u s
            h=$(curl -sS -m 20 -D - -o /tmp/ghu.json -H "Authorization: Bearer $tok" https://api.github.com/user | tr -d '\r')
            u=$(jq -r '.login // .message // "?"' /tmp/ghu.json)
            s=$(echo "$h" | grep -i '^x-oauth-scopes:' | cut -d' ' -f2-)
            echo "$label github_login=$u scopes=${s:-n/a}"
          }

          probe "T1_CF_API_TOKEN" "${T1:-}"
          probe "T2_CLOUDFLARE_API_TOKEN" "${T2:-}"
